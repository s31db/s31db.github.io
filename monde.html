<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>Le bureau de Samuel</title>
  <meta name="description" content="Entrez dans le bureau de Samuel Bastiat : ses livres, ses émissions, son travail, en 3D.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap">
  <script data-goatcounter="https://s31db.goatcounter.com/count" async src="/js/count.js"></script>
  <!-- Généré depuis logibla_fps/monde/monde.html (npm run build:monde) : modifier la source, pas cette copie. -->
  <script>
    // Jour ou nuit choisi à la dernière visite (cf. monde/theme.ts), appliqué avant l'affichage
    try {
      var t = localStorage.getItem('monde-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <style>
    /* Couleurs du site en clair ; en sombre, le bureau le soir (la scène suit, cf. monde.ts).
       data-theme="light" ou "dark" sur <html> force l'un ou l'autre. */
    :root {
      color-scheme: light;
      --bg: #faf9f6;
      --text: #1e1c1a;
      --muted: #6b6560;
      --border: #e4e0da;
      --accent: #2d4a5a;
      --bar: rgba(250, 249, 246, 0.88);
      --room: #e9e4da;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #1a1816;
        --text: #f1ece4;
        --muted: #b3aba1;
        --border: #3a3530;
        --accent: #8fc1d6;
        --bar: rgba(26, 24, 22, 0.86);
        --room: #24201c;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1a1816;
      --text: #f1ece4;
      --muted: #b3aba1;
      --border: #3a3530;
      --accent: #8fc1d6;
      --bar: rgba(26, 24, 22, 0.86);
      --room: #24201c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: var(--room);
      color: var(--text);
      overflow: hidden;
    }
    #monde { position: fixed; inset: 0; }
    #monde canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .monde-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .6rem 1rem;
      background: var(--bar);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .monde-bar a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      font-size: .95rem;
    }
    .monde-bar a:hover, .monde-bar a:focus-visible { color: var(--text); text-decoration: underline; }
    .monde-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .monde-actions { display: flex; align-items: center; gap: .75rem; min-width: 0; }
    /* Bascule jour/nuit (comme l'horloge murale de la scène) : soleil le jour, croissant la nuit */
    #monde-theme {
      flex: none;
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    #monde-theme:hover, #monde-theme:focus-visible { border-color: var(--accent); color: var(--accent); }
    #monde-theme svg { width: 1.2rem; height: 1.2rem; }
    #monde-theme .moon, #monde-theme[data-mode="dark"] .sun { display: none; }
    #monde-theme[data-mode="dark"] .moon { display: block; }

    /* Boutons des livres : transparents, recalés sur chaque tranche (cf. monde/overlay.ts) */
    #monde-books { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
    .monde-book {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: auto;
      background: transparent;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
    }
    .monde-book:focus-visible { outline: 2px solid #ff8a2a; outline-offset: 2px; }
    #monde-hover {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 6;
      max-width: 18rem;
      padding: .3rem .6rem;
      border-radius: .4rem;
      background: var(--text);
      color: var(--bg);
      font-size: .85rem;
      pointer-events: none;
    }
    #monde-hover[hidden] { display: none; }

    /* Légende du livre choisi : en bas à droite, en bas en pleine largeur sur téléphone */
    #monde-caption {
      position: fixed;
      right: 1rem;
      bottom: 4.5rem;
      z-index: 7;
      width: min(24rem, calc(100vw - 2rem));
      padding: 1rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: .75rem;
      background: var(--bar);
      backdrop-filter: blur(10px);
      line-height: 1.5;
    }
    #monde-caption[hidden] { display: none; }
    #monde-caption h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.2rem; line-height: 1.25; }
    #monde-caption p { margin-top: .4rem; font-size: .95rem; }
    .monde-caption-tagline { font-style: italic; color: var(--muted); }
    .monde-caption-audio { color: var(--muted); }
    .monde-caption-links { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-top: .7rem; }
    .monde-caption-links a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .monde-caption-links a:hover, .monde-caption-links a:focus-visible { text-decoration: underline; }

    .monde-primary {
      margin-top: .8rem;
      padding: .5rem 1rem;
      border: 0;
      border-radius: .5rem;
      background: var(--accent);
      color: var(--bg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .monde-primary:hover, .monde-primary:focus-visible { filter: brightness(1.1); outline: 2px solid var(--accent); outline-offset: 2px; }
    .monde-caption-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .monde-secondary {
      margin-top: .8rem;
      padding: .5rem .9rem;
      border: 1px solid var(--border);
      border-radius: .5rem;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .monde-secondary:hover, .monde-secondary:focus-visible { border-color: var(--accent); color: var(--accent); }
    /* Liens présentés en boutons (panneau des salles voisines) */
    a.monde-primary, a.monde-secondary { display: inline-block; text-decoration: none; }
    /* Présentation à vivre : ce que dit Samuel (défile s'il est long), pastilles, navigation */
    #monde-caption.presenting { display: flex; flex-direction: column; max-height: calc(100vh - 9.5rem); }
    #monde-caption.presenting[hidden] { display: none; }
    .monde-presenting-body { overflow-y: auto; min-height: 0; }
    .monde-dots { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .7rem; }
    .monde-dots button { min-width: 1.9rem; height: 1.9rem; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text); font: inherit; font-size: .8rem; cursor: pointer; }
    .monde-dots button[aria-current=true] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .monde-dots button:hover, .monde-dots button:focus-visible { border-color: var(--accent); }
    /* Téléphone : le panneau, plus bas, laisse voir la diapositive ; précédente et suivante suffisent */
    @media (max-width: 759px) { #monde-caption.presenting { max-height: 38vh; } .monde-dots { display: none; } }
    /* Album du jukebox : l'histoire de l'album, puis les pistes (en toucher une la lance) */
    .monde-album-story { white-space: pre-line; color: var(--muted); font-size: .9rem; }
    details.monde-album-story { margin-top: .4rem; }
    details.monde-album-story summary { cursor: pointer; color: var(--accent); font-weight: 600; white-space: normal; }
    .monde-tracks { margin: .6rem 0 0; padding: 0; list-style: none; counter-reset: piste; }
    .monde-tracks li { counter-increment: piste; }
    .monde-tracks button { display: flex; gap: .5rem; align-items: baseline; width: 100%; padding: .3rem .4rem; border: 0; border-radius: .4rem; background: transparent; color: var(--text); font: inherit; font-size: .92rem; text-align: left; cursor: pointer; }
    .monde-tracks button::before { content: counter(piste) '.'; min-width: 1.4rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .monde-tracks button:hover, .monde-tracks button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .monde-tracks button[aria-current=true] { color: var(--accent); font-weight: 700; }
    .monde-tracks button[aria-current=true]::before { content: '♪'; color: var(--accent); }
    .monde-holo-modes { display: flex; gap: .3rem; margin-top: .6rem; }
    .monde-holo-modes button { flex: 1; padding: .3rem .4rem; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text); font: inherit; font-size: .8rem; cursor: pointer; }
    .monde-holo-modes button[aria-pressed=true] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .monde-track-badge { margin-left: auto; padding: 0 .4rem; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: .72rem; font-weight: 400; }
    /* Mini-atelier : réponses au choix, une par ligne */
    .monde-choices { display: flex; flex-direction: column; gap: .4rem; margin-top: .7rem; }
    .monde-choices button { padding: .55rem .8rem; border: 1px solid var(--border); border-radius: .5rem; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    .monde-choices button:hover, .monde-choices button:focus-visible { border-color: var(--accent); color: var(--accent); }
    .monde-dialogue + .monde-caption-actions { margin-top: .4rem; }
    .monde-choices.many { display: grid; grid-template-columns: 1fr 1fr; }
    .monde-choices.many button { padding: .4rem .6rem; font-size: .9rem; }
    /* Navigation des diapositives sous les liens d'une salle */
    #monde-caption .monde-room-nav { margin: .8rem -1.1rem -1rem; }

    /* Panneau de lecture : texte complet de la double page ouverte, commandes des pages.
       Largeur et hauteur suivies par readingArea() dans monde.ts. */
    #monde-caption.reading {
      top: 4.5rem;
      bottom: 4.5rem;
      width: min(26rem, 42vw);
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .monde-reading-body { flex: 1; overflow-y: auto; padding: 1rem 1.1rem; }
    .monde-reading-body ol { margin: .5rem 0 0 1.2rem; font-size: .95rem; }
    .monde-reading-body li { margin-top: .2rem; }
    .monde-extract, .monde-quote { white-space: pre-line; }
    .monde-quote { font-style: italic; }
    .monde-reading-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .4rem;
      padding: .6rem 1.1rem;
      border-top: 1px solid var(--border);
    }
    .monde-reading-nav button {
      padding: .35rem .7rem;
      border: 1px solid var(--border);
      border-radius: .45rem;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
    }
    .monde-reading-nav button:disabled { opacity: .4; cursor: default; }
    .monde-reading-nav button:last-child { margin-left: auto; }
    .monde-reading-nav button:not(:disabled):hover, .monde-reading-nav button:focus-visible { border-color: var(--accent); color: var(--accent); }
    .monde-reading-page { font-size: .85rem; color: var(--muted); }

    /* Mini-lecteur de la radio : sous la barre, tant qu'une émission est chargée */
    #monde-radio {
      position: fixed;
      top: 3.6rem;
      left: 50%;
      z-index: 9;
      display: flex;
      align-items: center;
      gap: .5rem;
      max-width: calc(100vw - 1rem);
      padding: .3rem .4rem .3rem .8rem;
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bar);
      backdrop-filter: blur(8px);
      font-size: .85rem;
    }
    #monde-radio[hidden] { display: none; }
    #monde-radio [hidden] { display: none; }
    /* Proposition (rien de chargé, ou émission terminée) : le bouton d'accord est mis en avant */
    #monde-radio.proposing .monde-radio-tune { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .monde-radio-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 28rem; }
    .monde-radio-time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #monde-radio button {
      width: 2rem;
      height: 2rem;
      flex: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    #monde-radio button:hover, #monde-radio button:focus-visible { border-color: var(--accent); color: var(--accent); }

    /* Accueils (cf. monde/welcome.ts) : le texte est lu aux lecteurs d'écran, jamais affiché en double */
    /* Bulle de BD de l'accueil D, au-dessus des livres (vue étagère) */
    .monde-bd {
      position: fixed;
      top: 16%;
      left: 50%;
      z-index: 6;
      max-width: min(24rem, calc(100vw - 2rem));
      min-height: 2.8rem;
      padding: .8rem 1.2rem;
      transform: translateX(-50%) rotate(-1.5deg);
      border: 3px solid #1e1c1a;
      border-radius: 1.6rem;
      background: #fffdf6;
      color: #1e1c1a;
      font: 1.25rem/1.35 "Comic Sans MS", "Segoe Print", cursive;
      text-align: center;
      box-shadow: 4px 5px 0 rgba(0, 0, 0, .25);
      pointer-events: none;
    }
    .monde-bd[hidden] { display: none; }
    @media (max-width: 600px) { .monde-bd { top: 9%; font-size: 1.05rem; padding: .6rem .9rem; } }
    /* Pointe de la bulle, vers les livres */
    .monde-bd::before, .monde-bd::after {
      content: "";
      position: absolute;
      left: 40%;
      border-style: solid;
    }
    .monde-bd::before { bottom: -22px; border-width: 22px 14px 0 0; border-color: #1e1c1a transparent transparent transparent; }
    .monde-bd::after { bottom: -15px; left: calc(40% + 3px); border-width: 16px 10px 0 0; border-color: #fffdf6 transparent transparent transparent; }
    .monde-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .monde-replay {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .85rem;
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
    }
    .monde-replay:hover, .monde-replay:focus-visible { color: var(--accent); }
    @media (max-width: 520px) { .monde-replay { display: none; } }

    #monde-summary { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
    #monde-summary[hidden] { display: none; }
    #monde-jukebox { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
    #monde-jukebox[hidden] { display: none; }
    .monde-sections { display: none; gap: 1rem; font-size: .9rem; }
    :root[data-sommaire="barre"] .monde-sections { display: flex; }
    :root[data-sommaire="barre"] .monde-nav-lectern { display: none; }
    .monde-nav .short { display: none; }
    @media (max-width: 480px) {
      .monde-nav button { padding: .4rem .6rem; font-size: .85rem; }
      .monde-nav .long { display: none; }
      .monde-nav .short { display: inline; }
    }
    @media (max-width: 759px) { :root[data-sommaire="barre"] .monde-sections { display: none; } }
    /* Boutons du bas : ceux du bureau, ou ceux de l'aile voisine (cf. monde/wing.ts) */
    :root[data-lieu="aile"] .monde-nav-office, :root:not([data-lieu="aile"]) .monde-nav-wing { display: none; }

    /* Lecteur vidéo posé sur le mini-écran de la radio (cf. monde.ts, recalé à chaque image) */
    #monde-video { position: fixed; top: 0; left: 0; z-index: 3; background: #000; }
    #monde-video[hidden] { display: none; }
    #monde-video iframe { display: block; width: 100%; height: 100%; border: 0; }
    /* Écran de fin, sur la vidéo : les autres vidéos et « Revoir » */
    .monde-video-end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%; padding: 4%; background: rgba(10, 10, 12, .96); color: #fff; font: inherit; }
    .monde-video-end p { font-size: clamp(.8rem, 2.4vw, 1.1rem); font-weight: 600; }
    .monde-video-list { display: flex; gap: 4%; justify-content: center; width: 100%; }
    .monde-video-list button { flex: 0 1 45%; display: flex; flex-direction: column; gap: .3rem; padding: 0; border: 0; background: none; color: #fff; font: inherit; font-size: clamp(.7rem, 1.8vw, .9rem); text-align: left; cursor: pointer; }
    .monde-video-list img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: .3rem; outline: 2px solid transparent; }
    .monde-video-list button:hover img, .monde-video-list button:focus-visible img { outline-color: #8fc1d6; }
    .monde-video-again { padding: .3rem .8rem; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; background: none; color: #fff; font: inherit; font-size: clamp(.7rem, 1.8vw, .9rem); cursor: pointer; }
    /* Fondu au noir (couleur de la pièce) quand la caméra passe d'une pièce à l'autre sans vol */
    #monde-fade { position: fixed; inset: 0; z-index: 4; background: var(--room); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    #monde-fade.on { opacity: 1; }
    /* Pendant un trajet derrière Samuel : comment passer */
    #monde-skip { position: fixed; left: 50%; bottom: 4.6rem; z-index: 8; transform: translateX(-50%); padding: .35rem .9rem; border: 1px solid var(--border); border-radius: 999px; background: var(--bar); backdrop-filter: blur(8px); color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer; }
    #monde-skip[hidden] { display: none; }
    #monde-skip:hover, #monde-skip:focus-visible { color: var(--accent); border-color: var(--accent); }

    /* Points de vue */
    .monde-nav {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      z-index: 8;
      display: flex;
      gap: .25rem;
      padding: .25rem;
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bar);
      backdrop-filter: blur(8px);
    }
    .monde-nav button {
      padding: .4rem .9rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: .9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .monde-nav button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
    .monde-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 600px) {
      #monde-caption { left: 1rem; right: 1rem; width: auto; bottom: 4.25rem; }
    }
    @media (max-width: 759px) {
      /* Écran étroit : le livre en haut, le panneau de lecture en bas (cf. readingArea) */
      #monde-caption.reading { top: auto; left: .5rem; right: .5rem; width: auto; height: calc(54vh - 4.5rem); bottom: 4.25rem; }
    }

    .monde-screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 1rem;
      text-align: center;
      background: var(--bg);
      color: var(--muted);
    }
    .monde-screen p { max-width: 28rem; line-height: 1.6; }
    .monde-screen a { color: var(--accent); font-weight: 600; }
    .monde-screen[hidden] { display: none; }
  </style>
</head>
<body>
  <header class="monde-bar">
    <a href="index.html">← Retour au site</a>
    <!-- Variante A (?sommaire=0) : les sections du site, à la place du grand livre-sommaire -->
    <nav class="monde-sections" aria-label="Sections du site">
      <a href="index.html#manifeste">Manifeste</a>
      <a href="outils.html">Outils</a>
      <a href="ateliers.html">Ateliers</a>
      <a href="https://logibla.fr" target="_blank" rel="noopener">Logibla ↗</a>
    </nav>
    <div class="monde-actions">
      <button type="button" id="monde-replay" class="monde-replay">Revoir l'accueil</button>
      <span class="monde-title">Le bureau de Samuel</span>
      <button id="monde-theme" type="button" aria-label="Passer à la nuit" title="Passer à la nuit">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="monde" aria-label="Le bureau de Samuel, en 3D"></main>
  <div id="monde-books" role="group" aria-label="Les livres de l'étagère"></div>
